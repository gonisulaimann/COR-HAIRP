# COR-HARP Backend Deployment
# Creates a zip with source code + models + data files.
# Azure Oryx builds Python dependencies from requirements.txt during deployment.

name: Build and deploy Python app to Azure Web App - cor-harp-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p deploy-staging
          # Backend source
          cp -r backend/ deploy-staging/
          cp requirements.txt deploy-staging/
          cp startup.sh deploy-staging/
          # hairp_app source + models (NOT venv)
          mkdir -p deploy-staging/hairp_app
          cp hairp_app/*.py deploy-staging/hairp_app/
          cp -r hairp_app/models/ deploy-staging/hairp_app/
          cp hairp_app/.env deploy-staging/hairp_app/ 2>/dev/null || true
          # Data files (humanitarian datasets)
          if [ -d "data" ]; then
            cp -r data/ deploy-staging/data/
            echo "Included data/ directory:"
            du -sh deploy-staging/data/
          else
            echo "WARNING: data/ directory not found"
          fi
          # Create zip
          cd deploy-staging && zip -r ../deploy.zip . && cd ..
          echo "Package size:"
          ls -lh deploy.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ED340D6D3C904341A05F9A6684EF3BDB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0616FEFA6964957998B9F251E42E5C0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E962D5150C354D749D7C33116338574A }}

      - name: Configure Azure App Service
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config set \
              --resource-group RG-COR-HARP \
              --name cor-harp-api \
              --startup-file "startup.sh"
            az webapp config appsettings set \
              --resource-group RG-COR-HARP \
              --name cor-harp-api \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true DO_CLEAN_DEPLOYMENT=true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'cor-harp-api'
          slot-name: 'Production'
          package: deploy.zip

      - name: Wait for Oryx build and app startup
        run: sleep 120

      - name: Health check
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 15); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "https://cor-harp-api.azurewebsites.net/api/health" 2>/dev/null)
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy (attempt $i)"
              curl -s "https://cor-harp-api.azurewebsites.net/api/health"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS - waiting 30s..."
            sleep 30
          done
          echo "Backend failed to become healthy after 15 attempts"
          exit 1
