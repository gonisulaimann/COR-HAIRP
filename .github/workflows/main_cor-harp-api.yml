# COR-HARP Backend Deployment
# Uses Azure Oryx to build Python dependencies during deployment.
# No pre-built virtualenv is uploaded — Oryx handles pip install from requirements.txt.

name: Build and deploy Python app to Azure Web App - cor-harp-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ED340D6D3C904341A05F9A6684EF3BDB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D0616FEFA6964957998B9F251E42E5C0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E962D5150C354D749D7C33116338574A }}

      - name: Configure Azure App Service
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config set \
              --resource-group RG-COR-HARP \
              --name cor-harp-api \
              --startup-file "startup.sh"
            az webapp config appsettings set \
              --resource-group RG-COR-HARP \
              --name cor-harp-api \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'cor-harp-api'
          slot-name: 'Production'
